<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>ai-mascot — recording scene</title>
  <!--
    The scene used to record the README GIF. It plays by itself.
    The reply is scripted (no model call) so the recording is the same every time.
  -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", Roboto, sans-serif; color: #2a2118; background: #fbf7f1; overflow: hidden; height: 100vh; }
    .nav { display: flex; align-items: center; gap: 28px; padding: 20px 40px; border-bottom: 1px solid #efe5d6; }
    .nav b { font-size: 20px; letter-spacing: 0.02em; } .nav b span { color: #c8742e; }
    .nav i { font-style: normal; font-size: 14px; color: #8a7a66; }
    .hero { display: grid; grid-template-columns: 1fr; gap: 26px; padding: 40px 40px; max-width: 520px; }
    .hero h1 { margin: 0 0 14px; font-size: 44px; line-height: 1.15; letter-spacing: -0.02em; }
    .hero p { margin: 0; font-size: 17px; line-height: 1.8; color: #6d5d4b; }
    .bread { height: 170px; border-radius: 24px; background: radial-gradient(circle at 35% 40%, #f2c27b, #d68a3c 60%, #a65a22); box-shadow: 0 30px 60px -30px rgba(120,60,20,0.6); position: relative; }
    .bread::after { content: ''; position: absolute; inset: 22% 18%; border-radius: 50%; border: 6px solid rgba(255,240,210,0.55); border-left-color: transparent; border-right-color: transparent; transform: rotate(-12deg); }
    .cursor { position: fixed; z-index: 2147483600; left: 0; top: 0; width: 26px; height: 26px; pointer-events: none; transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
    .cursor.click { animation: click 0.25s ease; }
    @keyframes click { 50% { scale: 0.8; } }
    .tag { position: fixed; left: 40px; bottom: 30px; padding: 10px 16px; border-radius: 999px; background: #2a2118; color: #fff; font-size: 15px; font-weight: 600; opacity: 0; transform: translateY(8px); transition: opacity 0.4s, transform 0.4s; }
    .tag.on { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <div class="nav"><b>Komugi <span>Bakery</span></b><i>Menu</i><i>Hours</i><i>Access</i></div>
  <section class="hero">
    <div><h1>Fresh bread,<br>every morning.</h1><p>A small bakery by the station. Melon pan, croissants and seasonal sandwiches, baked from 6 a.m.</p></div>
    <div class="bread"></div>
  </section>
  <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M3 2 L 3 20 L 8 15 L 12 23 L 15 21.5 L 11 14 L 18 14 Z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  <div class="tag" id="tag"></div>
  <ai-mascot id="m" endpoint="/demo/chat" theme="light" lang="en" tone="friendly" name="YUA"></ai-mascot>

  <script type="module">
    import 'ai-mascot';

    // Scripted answer, streamed like the real server does.
    const ANSWER = "Yes! On Sundays we're open 7:00–15:00. We're closed on Mondays. 🥐";
    const realFetch = window.fetch.bind(window);
    window.fetch = (url, init) => {
      if (String(url) !== '/demo/chat') return realFetch(url, init);
      const enc = new TextEncoder();
      const body = new ReadableStream({
        async start(c) {
          await wait(900);
          c.enqueue(enc.encode(`data: ${JSON.stringify({ sources: [{ title: 'Opening hours', url: 'https://example.com/hours' }] })}\n\n`));
          for (const piece of ANSWER.match(/.{1,3}/gsu)) { c.enqueue(enc.encode(`data: ${JSON.stringify({ delta: piece })}\n\n`)); await wait(55); }
          c.enqueue(enc.encode('data: {"done":true}\n\n')); c.close();
        },
      });
      return Promise.resolve(new Response(body, { headers: { 'content-type': 'text/event-stream' } }));
    };

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const m = document.getElementById('m');
    const cursor = document.getElementById('cursor');
    const tag = document.getElementById('tag');
    const root = () => m.shadowRoot;
    const moveTo = (el, dx = 0, dy = 0) => { const r = el.getBoundingClientRect(); cursor.style.transform = `translate(${r.left + r.width / 2 + dx}px, ${r.top + r.height / 2 + dy}px)`; };
    const click = async () => { cursor.classList.remove('click'); void cursor.offsetWidth; cursor.classList.add('click'); await wait(250); };
    const say = (t) => { tag.textContent = t; tag.classList.toggle('on', !!t); };

    async function play() {
      cursor.style.transform = 'translate(420px, 330px)';
      await wait(1400);
      // 1) click the mascot
      moveTo(root().querySelector('.launcher'), 4, 6);
      await wait(1000);
      await click();
      m.open();
      await wait(1100);
      // 2) type a question
      moveTo(root().querySelector('textarea'), -60, 4);
      const ta = root().querySelector('textarea');
      const q = 'Are you open on Sundays?';
      for (let i = 1; i <= q.length; i++) { ta.value = q.slice(0, i); ta.dispatchEvent(new Event('input')); await wait(45); }
      await wait(300);
      moveTo(root().querySelector('.send'));
      await wait(700);
      await click();
      root().querySelector('.form').requestSubmit();
      await new Promise((r) => m.addEventListener('ai-mascot:reply', r, { once: true }));
      await wait(1600);
      // 3) other characters
      say('5 characters · any color · OpenAI / Claude / Gemini / Ollama');
      cursor.style.transform = 'translate(380px, 300px)';
      for (const [c, color, name] of [['dog', '#e8bf8e', 'KOTA'], ['bear', '#c9a27e', 'MOCHI'], ['robot', '#b9c6d3', 'BOLT'], ['ghost', '#c7d2ff', 'BOO'], ['cat', '#f4b6c2', 'YUA']]) {
        m.setAttribute('character', c); m.setAttribute('color', color); m.setAttribute('name', name);
        await wait(850);
      }
      await wait(1200);
      document.documentElement.dataset.done = '1';
    }
    if (new URLSearchParams(location.search).has('play')) play();
  </script>
</body>
</html>
