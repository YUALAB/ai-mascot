name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm -r --filter "./packages/**" build
      - name: Widget size budget (gzip < 30 KB)
        run: |
          size=$(gzip -c packages/widget/dist/ai-mascot.iife.js | wc -c)
          echo "gzip size: $size bytes"
          test "$size" -lt 30720
